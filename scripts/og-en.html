<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
.og{width:1200px;height:630px;box-sizing:border-box;padding:64px 72px;position:relative;
 background:var(--navy);color:var(--on-navy);
 background-image:linear-gradient(var(--grid-navy) 1px,transparent 1px),linear-gradient(90deg,var(--grid-navy) 1px,transparent 1px);background-size:32px 32px;
 display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:14px;color:#fff}

.box{border:1px solid var(--on-navy-soft);font-family:var(--f-mono);font-size:17px;white-space:nowrap;flex:none}

</div></body></html>
