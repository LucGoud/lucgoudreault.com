<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accueil | Luc Goudreault</title>
<meta name="description" content="Cette ancienne page du site de Luc Goudreault redirige maintenant vers l'accueil, en français et en anglais.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.lucgoudreault.com/fr/">
<!-- Ancienne adresse du site Framer, conservée pour ne briser aucun lien. -->
<script>
(function () {
  var cible = "fr/";
  try {
    var choix = localStorage.getItem("lg_lang");
    var langue = choix === "fr" || choix === "en" ? choix
      : (navigator.language || "fr").slice(0, 2).toLowerCase() === "fr" ? "fr" : "en";
    if (langue === "en") cible = "en/";
  } catch (e) {}
  location.replace(cible + location.hash);
})();
</script>
<meta http-equiv="refresh" content="0; url=fr/">
</head>
<body>
<p>Cette page a déménagé : <a href="fr/">lucgoudreault.com/fr/</a>. This page has moved: <a href="en/" lang="en">lucgoudreault.com/en/</a>.</p>
</body>
</html>
