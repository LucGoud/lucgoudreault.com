<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offres | Luc Goudreault</title>
<meta name="description" content="Les offres de Luc Goudreault sont maintenant à l'adresse lucgoudreault.com/fr/offres, en français et en anglais.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.lucgoudreault.com/fr/offres">
<!-- Ancienne adresse du site Framer, conservée pour ne briser aucun lien. -->
<script>
(function () {
  var cible = "fr/offres";
  try {
    var choix = localStorage.getItem("lg_lang");
    var langue = choix === "fr" || choix === "en" ? choix
      : (navigator.language || "fr").slice(0, 2).toLowerCase() === "fr" ? "fr" : "en";
    if (langue === "en") cible = "en/roles";
  } catch (e) {}
  location.replace(cible + location.search + location.hash);
})();
</script>
<meta http-equiv="refresh" content="0; url=fr/offres">
</head>
<body>
<p>Cette page a déménagé : <a href="fr/offres">lucgoudreault.com/fr/offres</a>. <span lang="en">This page has moved: <a href="en/roles">lucgoudreault.com/en/roles</a>.</span></p>
</body>
</html>
