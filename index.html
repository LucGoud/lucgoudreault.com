<script>
/* Aiguillage de langue, comme junior.coach : choix mémorisé, sinon langue du navigateur, sinon français. */
(function () {
  var lang = "fr";
  try {
    var choix = localStorage.getItem("lg_lang");
    if (choix === "fr" || choix === "en") {
      lang = choix;
    } else if (navigator.language && navigator.language.slice(0, 2).toLowerCase() !== "fr") {
      lang = "en";
    }
  } catch (e) {}
  location.replace(lang + "/" + location.search + location.hash);
})();
</script>
